---
services:
  dockerify-android:
    container_name: ${ANDROID_CONTAINER_NAME:-dockerify-android}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    image: shmayro/dockerify-android:latest
    build:
      context: .
    ports:
      - "${ADB_PORT:-5555}:5555"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./extras:/extras
      - ./profiles:/opt/dockerify-android/profiles:ro
    environment:
      DEVICE_PROFILE: ${DEVICE_PROFILE:-pixel_5_android_11}
      DNS: ${DNS:-}
      RAM_SIZE: ${RAM_SIZE:-}
      # Optional screen resolution in WIDTHxHEIGHT format
      SCREEN_RESOLUTION: ${SCREEN_RESOLUTION:-}
      # Optional screen density (dpi)
      SCREEN_DENSITY: ${SCREEN_DENSITY:-}
      ROOT_SETUP: ${ROOT_SETUP:-0} # set to 1 to enable rooting
      GAPPS_SETUP: ${GAPPS_SETUP:-0} # set to 1 to install PICO GAPPS
      ARM_TRANSLATION: ${ARM_TRANSLATION:-1} # set to 1 to enable ARM translation (allows ARM64 apps)
      ALLOW_NO_KVM: ${ALLOW_NO_KVM:-0} # only bypass the KVM preflight for non-x86 experimental images
    privileged: true
    devices:
      - /dev/kvm

  scrcpy-web:
    container_name: ${SCRCPY_CONTAINER_NAME:-scrcpy-web}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    restart: unless-stopped
    image: shmayro/scrcpy-web:latest
    privileged: true
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      dockerify-android:
        condition: service_healthy
    command: >
      sh -c "
        adb connect dockerify-android:5555 &&
        npm start
      "
